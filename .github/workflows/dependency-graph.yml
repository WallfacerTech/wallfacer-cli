name: Dependency graph

# Submits the module graph the binary is actually built from, resolved by the
# Go toolchain go.mod asks for, so the dependency graph and Dependabot alerts
# track the versions that ship.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: WallfacerTech/openapi-cli-generator
          path: openapi-cli-generator

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Fix local module replace path
        run: go mod edit -replace github.com/WallfacerTech/openapi-cli-generator=./openapi-cli-generator

      - uses: actions/go-dependency-submission@v2
        with:
          go-mod-path: go.mod
          go-build-target: .
