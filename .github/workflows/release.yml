name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: WallfacerTech/openapi-cli-generator
          path: openapi-cli-generator

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Fix local module replace path
        run: |
          go mod edit -replace github.com/WallfacerTech/openapi-cli-generator=./openapi-cli-generator
          git update-index --assume-unchanged go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
