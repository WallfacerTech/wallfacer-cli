name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: WallfacerTech/openapi-cli-generator
          path: openapi-cli-generator

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Fix local module replace path
        run: go mod edit -replace github.com/WallfacerTech/openapi-cli-generator=./openapi-cli-generator

      - run: go vet ./...
      - run: go build -o wallfacer .
