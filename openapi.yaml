    post:
      summary: 'Create an upload'
      operationId: createAnUpload
      description: "Reserves a location for one file and returns a URL to send it to.\n\nSend the file with a single `PUT` to `upload_url`, carrying every header in\n`upload_headers` exactly as returned. They commit you to the size and digest you\ndeclared, so a body that does not match is refused where it lands rather than\naccepted and rejected later. Then mark the upload ready.\n\nThe URL is valid for 30 minutes. After that it stops working, and an upload that\nwas never used is removed along with anything sent to it."
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
