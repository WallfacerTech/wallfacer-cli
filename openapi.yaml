          description: 'Your feed: returns every task relevant to you, whether or not you own it, spanning tasks you own or acted on, commented on or directed, or that handle a pull request you authored or an issue you reported. Each returned row carries a `relevance` array naming the reasons it matched. Composes with the other filters.'
