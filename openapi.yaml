                  example: 'Support Engineer'
                handle:
                  type: string
                  description: 'The name the agent answers to everywhere: the part before the @ in its email address, and the name people type after the @ in Slack. Lowercase letters, numbers, periods, hyphens and underscores, 2 to 64 characters, starting and ending with a letter or a number. It has to be free in this account and in your Google domain, and it is never reused once an agent has had it. Changing it renames the agent on every system it holds an account on. The old email address keeps delivering as an alias, so mail, shared documents and calendar invitations survive, and the change can take up to ten minutes to appear everywhere. Send the handle the agent already has to retry a rename a system did not accept the first time.'
