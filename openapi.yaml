                        description: 'The content as base64, for callers that would rather not embed raw text in JSON. Must decode to valid UTF-8. Provide exactly one of `text`, `content_base64`, or `upload_id`. This field is required when none of <code>inputs.*.text</code> and <code>inputs.*.upload_id</code> are present.'
