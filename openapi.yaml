    delete:
      summary: 'Delete an account'
      operationId: deleteAnAccount
      description: "Permanently deletes an account and tears down all of its resources: environments, snapshots, running VMs, tasks, sessions, secrets, pipelines, and events. Requires the `owner` role.\n\nDestructive and irreversible: live infrastructure (VMs, S3 snapshots) is destroyed immediately. The account record is retained in a deactivated state for a 30-day grace window during which support can restore the metadata shell (not the destroyed infrastructure), then permanently purged.\n\nConfirmation is required: send a `confirm` field whose value exactly matches the account's name. Returns `202 Accepted` because teardown runs asynchronously. The call is idempotent: repeating it on an already-deleted account returns `202` without requiring the confirmation again."
      parameters: []
      responses:
        202:
          description: 'Deletion accepted; teardown is in progress.'
          content:
            text/plain:
              schema:
                type: string
                example: ''
        403:
          description: 'Caller is not an owner of the account.'
          content:
            application/json:
              schema:
                type: object
                example:
                  errors:
                    -
                      message: 'This action requires at least the owner role.'
                      code: insufficient_role
                properties:
                  errors:
                    type: array
                    example:
                      -
                        message: 'This action requires at least the owner role.'
                        code: insufficient_role
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                          example: 'This action requires at least the owner role.'
                        code:
                          type: string
                          example: insufficient_role
        422:
          description: 'The `confirm` field did not match the account name.'
          content:
            application/json:
              schema:
                type: object
                example:
                  errors:
                    -
                      message: 'Confirmation must match the account name.'
                      code: confirmation_mismatch
                properties:
                  errors:
                    type: array
                    example:
                      -
                        message: 'Confirmation must match the account name.'
                        code: confirmation_mismatch
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                          example: 'Confirmation must match the account name.'
                        code:
                          type: string
                          example: confirmation_mismatch
      tags:
        - Accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm:
                  type: string
                  description: "A safety confirmation for this irreversible action. Must exactly match the account's `name`."
                  example: 'Acme Inc'
              required:
                - confirm
