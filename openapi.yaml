  '/v1/accounts/{account_id}/tasks':
    get:
      summary: 'List tasks'
      operationId: listTasks
      description: "Returns tasks for the account. Without filters, ordered by most recent activity first (the latest of the task's own `updated_at` and any of its sessions' `last_activity_at`). The filters turn this list into the inbox: `needs_me=true` is the decision queue (tasks waiting on you), `awaiting_human=true` is every task waiting on a human, and the owner/status filters slice the rest."
      parameters:
        -
          in: query
          name: needs_me
          description: 'The decision queue. Returns only tasks waiting on a human decision routed to you: a gate where you are the named approver, or any task you own that errored or is parked at a gate. Unowned tasks never route here; find those with `unassigned=true`. The headline inbox filter.'
          example: true
          required: false
          schema:
            type: boolean
            description: 'The decision queue. Returns only tasks waiting on a human decision routed to you: a gate where you are the named approver, or any task you own that errored or is parked at a gate. Unowned tasks never route here; find those with `unassigned=true`. The headline inbox filter.'
            example: true
        -
          in: query
          name: awaiting_human
          description: 'Returns every task currently waiting on a human: parked at an approval gate, or stopped in error. Combine with `unassigned=true` for the shared "needs someone" queue.'
          example: false
          required: false
          schema:
            type: boolean
            description: 'Returns every task currently waiting on a human: parked at an approval gate, or stopped in error. Combine with `unassigned=true` for the shared "needs someone" queue.'
