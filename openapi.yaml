    patch:
      summary: 'Mark an upload ready'
      operationId: markAnUploadReady
      description: "Confirms that the file has been sent, and checks it.\n\nThe stored file must be exactly the size you declared, match the SHA-256 you\ndeclared, and be valid UTF-8 text. Only then is it moved somewhere the upload URL\ncannot reach, so a URL you still hold cannot change a file an agent has already been\ntold the digest of.\n\nSafe to repeat: an upload that is already ready returns its current state unchanged."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 0cf62e96-2beb-49b1-a8a9-07a85dd647d8
                    name: server-log.txt
                    media_type: text/plain
                    encoding: utf-8
                    byte_size: 8388608
