            description: 'Filter to a single lifecycle status: `active`, `paused`, `done`, `error`, or `cancelled`.'
            example: active
        -
          in: query
          name: owner_user_id
          description: 'Filter to tasks owned by this user.'
          example: 6924
          required: false
          schema:
