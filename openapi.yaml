                  example: 'Fix login redirect on Safari'
                  nullable: true
                prompt:
                  type: string
                  description: 'Instructions for the AI agent. If provided, a session starts immediately and this becomes the first message.'
                  example: 'Fix the login bug on the /auth page'
                message:
                  type: string
                  description: "Kickoff instruction for a handbook run. Only valid with `pipeline_id`. Unlike `prompt`, it does not start a freeform session. It is recorded as the task's synthetic trigger event (with you as the actor) and surfaced to the first AI step as the triggering context. Optional: omit it to run the handbook purely on its authored steps."
                  example: 'Focus on the checkout flow; the regression only shows up with a saved card.'
                  nullable: true
                environment_id:
                  type: string
                  description: 'Default environment for sessions created under this task. Optional: when omitted, the task defaults to the environment configured on its agent (see `created_by`), so a task that names an agent lands where that agent works without you naming the environment. Omit it (and leave the agent without an environment) when the task spans multiple environments (for example, work that touches a backend repo and a frontend repo) and specify `environment_id` per session instead. An explicit value here always wins. When resolved, sessions inherit it unless they pass their own `environment_id` on create. Must be a valid UUID.'
                  example: 019d8e44-e110-71f6-864b-8e91470dcc4a
                  nullable: true
                created_by:
                  type: integer
                  description: "ID of the agent this task runs as: its execution identity, which every commit, pull request, and credential resolves to. Must be an enabled agent of this account. Defaults to an enabled agent of the account: when an agent holds a GitHub token it is preferred (so a task whose environment does git work resolves to an identity that can clone and push), otherwise it falls back to the primary enabled agent. A connected GitHub identity only matters when the task's resolved environment has git sources; a repo-less environment needs none, so creation succeeds with no GitHub connected at all. The responsible human is recorded separately as the task owner (the authenticated caller when a human creates the task; agent-created tasks stay unowned). Task access is account-scoped, not restricted to the creator."
                  example: null
                  nullable: true
                attachments:
                  type: array
                  description: 'MCP-aligned attachments carried with the task. Each item must include `name`, a `mimeType`, and inline `text` or `blob`. Optionally include a `uri` to reference an external source.'
                  example:
                    -
                      name: 'PROJ-42 Login bug'
                      uri: 'https://example.com/tickets/42'
                      mimeType: text/markdown
                      text: '# PROJ-42: Login redirect on Safari'
                  items:
                    type: object
                    nullable: true
                    properties:
                      name:
                        type: string
                        description: 'Human-readable name for the attachment. Must not be greater than 255 characters.'
                        example: 'PROJ-42 Login bug'
                      description:
                        type: string
                        description: 'Optional longer description. Must not be greater than 5000 characters.'
                        example: 'From our internal ticket system'
                        nullable: true
                      mimeType:
                        type: string
                        description: 'MIME type for the inline content. Must not be greater than 255 characters.'
                        example: text/markdown
                        nullable: true
                      annotations:
                        type: object
                        description: 'MCP LLM hints per the Resource spec (e.g. `audience`, `priority`). Use `metadata` for display data.'
                        example: null
                        properties: {  }
                        nullable: true
                      metadata:
                        type: object
                        description: 'Free-form display data, keyed on `provider`. Stored as-is alongside the attachment.'
                        example: null
                        properties: {  }
                        nullable: true
                      uri:
                        type: string
                        description: 'Optional resource URI stored as a reference alongside the inline content. Must not be greater than 2048 characters.'
                        example: 'https://github.com/acme/foo/issues/42'
                        nullable: true
                      text:
                        type: string
                        description: 'Inline text content. Required when no `blob` is provided. Mutually exclusive with `blob`.'
                        example: null
                        nullable: true
                      blob:
                        type: string
                        description: 'Inline binary content, base64-encoded. Required when no `text` is provided. Mutually exclusive with `text`.'
                        example: null
                        nullable: true
                    required:
                      - name
                idle_timeout_seconds:
                  type: integer
                  description: 'Seconds of inactivity before sessions under this task are marked idle. When a session goes idle its VM is destroyed and billing for that VM stops, so tune this to how long you want to pay to hold a warm VM after the agent finishes speaking. Defaults to 300. Enforcement ticks every minute, so sub-minute values resolve at the next tick. Must be between 60 and 900.'
                  example: 600
                harness:
                  type: string
                  description: 'Which agent harness to run (e.g. `claude`, `codex`). Defaults to `claude`. Unknown harness ids fall back to `claude` rather than failing the request, so the response always reflects the harness actually used (read `session.vendor`). Must not be greater than 32 characters.'
                  example: claude
                  nullable: true
                model:
                  type: string
                  description: 'Model id to pin on the session, scoped to the chosen harness (e.g. `claude-opus-4-8` for claude; `gpt-5.5` for codex). When omitted or not in the harness whitelist, the harness picks its curated default. Recorded on the session as `harness_model` and forwarded as `--model` to the harness CLI. Must not be greater than 128 characters.'
                  example: claude-opus-4-8
                  nullable: true
                pipeline_id:
                  type: string
                  description: 'Must be a valid UUID.'
                  example: 6ff8f7f6-1eb3-3525-be4a-3932c805afed
                  nullable: true
                fields:
                  type: object
                  description: ''
                  example: null
                  properties: {  }
                  nullable: true
