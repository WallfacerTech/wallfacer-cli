                          type: string
                          example: 'Resource not found.'
                        code:
                          type: string
                          example: not_found
      tags:
        - 'Task Actions'
    patch:
      summary: 'Transition a task action'
      operationId: transitionATaskAction
      description: 'Drives every terminal state change on an action. Pass `{"status": "cancelled"}` to cancel a pending or running action. Pass `{"status": "success"}` or `{"status": "failure"}` to resolve an open human gate as approve or reject; the caller must be in the gate''s approver pool. Successful gate resolutions capture a `calibration_context` snapshot inline in `result.outcome` for the eventual trust-calibration loop. Transitioning an already-terminal action returns 409.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 019fc37d-2a65-7342-ac0d-c7d5c6e0496f
                    task_id: 019fc37d-2a52-71c7-aa71-ada92f7a9dee
                    pipeline_version_id: 019fc37d-2a64-71a5-acd6-d0c7881c227b
                    step_id: implement
                    kind: ai
                    spec:
                      title: 'Implement the change'
                    status: success
                    result: []
                    attempt: 1
                    manual: false
                    started_at: '2026-08-02T17:14:47.000000Z'
                    completed_at: '2026-08-02T17:19:47.000000Z'
                    next_check_at: null
                    deadline_at: null
                    created_at: '2026-08-02T17:19:48.000000Z'
                properties:
                  data:
                    $ref: '#/components/schemas/TaskAction'
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  errors:
                    -
                      message: "You are not in the gate's approver set."
                      code: forbidden
                properties:
                  errors:
                    type: array
                    example:
                      -
                        message: "You are not in the gate's approver set."
                        code: forbidden
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                          example: "You are not in the gate's approver set."
                        code:
                          type: string
                          example: forbidden
        409:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  errors:
                    -
                      message: 'This action has already been resolved.'
                      code: action_already_terminal
                properties:
                  errors:
                    type: array
                    example:
                      -
                        message: 'This action has already been resolved.'
                        code: action_already_terminal
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                          example: 'This action has already been resolved.'
                        code:
                          type: string
                          example: action_already_terminal
      tags:
        - 'Task Actions'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  description: 'Terminal status to transition the action to. `cancelled` ends a pending or running action. `success` resolves an open human gate as approve. `failure` resolves an open human gate as reject. Transitioning an already-terminal action returns 409.'
                  example: cancelled
                  enum:
                    - cancelled
                    - success
                    - failure
                comment:
                  type: string
                  description: 'Reviewer note recorded when transitioning a human gate to `success` or `failure`. Surfaces in the audit trail and feeds the next AI attempt on reject. Must not be greater than 5000 characters.'
                  example: 'Looks good, ship it.'
                  nullable: true
                reason:
                  type: string
                  description: 'Optional cancellation reason recorded alongside the cancelled status. Must not be greater than 500 characters.'
                  example: 'No longer needed; superseded by manual fix.'
                  nullable: true
              required:
                - status
