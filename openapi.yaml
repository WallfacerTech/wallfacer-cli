                        message:
                          type: string
                          example: 'You do not belong to this account or lack the credentials required to run snapshot generation.'
                        code:
                          type: string
                          example: forbidden
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  errors:
                    -
                      message: 'Environment not found.'
                      code: not_found
                properties:
                  errors:
                    type: array
                    example:
                      -
                        message: 'Environment not found.'
                        code: not_found
