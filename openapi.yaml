    post:
      summary: 'Compile a trigger from plain English'
      operationId: compileATriggerFromPlainEnglish
      description: 'Turns one plain-English description of when this pipeline should run into a deterministic trigger, deciding for you whether it is an EVENT trigger (fires in reaction to an inbound event) or a SCHEDULE trigger (fires on a time cadence). The response `kind` says which. For an event you get source/type/match filter(s) previewed against recent history plus a dedupe suggestion; for a schedule you get a cron expression + timezone and the next few fire times. Nothing is persisted. Add the returned trigger to the pipeline''s draft (an event block, or a `kind:"schedule"` block with cron + timezone) and publish a new version to put it live.'
      parameters: []
      responses:
        201:
          description: 'When `kind` is "event": the compiled filter(s), a preview against recent history, and a dedupe suggestion. When `kind` is "schedule": `cron`, `timezone`, `valid`, and `next_runs` (the next fire times, UTC ISO-8601).'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    kind: event
                    explanation: 'Fires when an issue is labeled bug.'
                    grounded_on_event_id: ...
                    triggers:
                      -
                        source: github
                        type: issue.labeled
                        match: "${event.data.label.name} == 'bug'"
                        sampled_recent: 20
                        matched_recent: 3
                        matched_event_ids:
                          - ...
                    dedupe:
                      enabled: true
                      key: '${event.data.issue.number}'
                      matched_events: 5
                      would_open_tasks: 3
                properties:
                  data:
                    type: object
                    properties:
                      kind:
                        type: string
                        example: event
                      explanation:
                        type: string
                        example: 'Fires when an issue is labeled bug.'
                      grounded_on_event_id:
                        type: string
                        example: ...
                      triggers:
                        type: array
                        example:
                          -
                            source: github
                            type: issue.labeled
                            match: "${event.data.label.name} == 'bug'"
                            sampled_recent: 20
                            matched_recent: 3
                            matched_event_ids:
                              - ...
                        items:
                          type: object
                          properties:
                            source:
                              type: string
                              example: github
                            type:
                              type: string
                              example: issue.labeled
                            match:
                              type: string
                              example: "${event.data.label.name} == 'bug'"
                            sampled_recent:
                              type: integer
                              example: 20
                            matched_recent:
                              type: integer
                              example: 3
                            matched_event_ids:
                              type: array
                              example:
                                - ...
                              items:
                                type: string
                      dedupe:
                        type: object
                        properties:
                          enabled:
                            type: boolean
                            example: true
                          key:
                            type: string
                            example: '${event.data.issue.number}'
                          matched_events:
