                        description: 'Discriminator for the message. Determines the shape of `payload`. Conversation UIs should render `user` and `assistant` turns, and skip or collapse the rest. Full per-variant payload shapes are documented on the `Message` schema in this spec.'
                        enum:
                          - user
                          - assistant
                          - last-prompt
                          - queue-operation
                          - attachment
                          - ai-title
                      sequence:
                        type: integer
                        example: 32
                        description: 'Order within the session, assigned when the message is delivered to the agent. Queued messages have `sequence: null`. Render with `ORDER BY sequence ASC` then `created_at ASC` to show the conversation top-to-bottom.'
                        nullable: true
                      status:
                        type: string
                        example: sent
                        description: "Delivery status:\n\n- `queued`: not yet sent to the agent. Will be picked up on the next resume.\n- `sent`: delivered and part of the transcript.\n- `failed`: delivery failed terminally.\n- `cancelled`: the user aborted the session before this message was delivered to the agent. Preserved in the transcript for audit but never replayed."
                        enum:
                          - queued
                          - sent
                          - failed
                          - cancelled
                      display_text:
                        type: string
                        example: null
                        description: 'Clean user-facing text when the underlying `payload` contains server-prepended context (for example, attachment preambles on a user turn). Only set on `type:"user"` messages that needed stripping. Null when the payload is already clean, in which case clients should fall back to `payload.message.content[0].text`.'
                        nullable: true
                      author:
                        type: string
                        example: null
                        description: 'The human who sent a user turn, as `{id, name, avatar_url}`, for rendering the sender next to the message bubble. Resolved from the message''s captured sender, falling back to the session owner for messages that predate per-message sender capture. Set only on `type:"user"` messages; null for assistant turns, non-conversational marker types, and sessions with no resolvable author (for example, automation sessions with no parent task).'
                        nullable: true
                      author_avatar_url:
                        type: string
                        example: null
                        description: 'Deprecated in favor of `author.avatar_url`; retained for older clients. Avatar URL for the human author of a user turn. Set only on `type:"user"` messages; null for assistant turns and non-conversational marker types. May also be null when the session has no resolvable author (for example, automation sessions with no parent task).'
                        nullable: true
                      agent_avatar_url:
                        type: string
                        example: null
                        description: 'Avatar image URL for the assistant that authored this message, for rendering next to the message bubble. Matches the vendor of the model running the session: the Anthropic logo for Claude sessions, the OpenAI logo for Codex sessions. Set on every message emitted by the agent or the platform (all non-`user` types); null on `type:"user"` turns, which carry the human sender in `author` instead. Treat the URL as opaque; the specific image may change.'
                        nullable: true
                      created_at:
                        type: string
                        example: '2026-08-02T17:19:47.000000Z'
                        description: 'ISO 8601 timestamp of when this message was created (that is, when it entered the queue or was delivered, depending on `status`).'
                      updated_at:
                        type: string
                        example: '2026-08-02T17:19:47.000000Z'
                        description: 'ISO 8601 timestamp of the most recent change to the message record (for example, when it flipped from `queued` to `sent`).'
                    required:
                      - id
                      - session_id
                      - payload
                      - type
                      - sequence
                      - status
                      - display_text
                      - author
                      - author_avatar_url
                      - agent_avatar_url
                      - created_at
                      - updated_at
