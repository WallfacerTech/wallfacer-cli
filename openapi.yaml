  '/v1/accounts/{account_id}/environments/{environment_id}/snapshots':
    post:
      summary: "Regenerate an environment's snapshot"
      operationId: regenerateAnEnvironmentsSnapshot
      description: "Triggers a fresh snapshot-generation cycle. A VM boots from the environment's manifest, runs setup to completion, captures the result, and the new snapshot is promoted to the environment's `base_snapshot_id`. Returns 202 immediately; the `snapshot_id` is null while generation is bootstrapping. Poll `GET /environments/{env}` and wait for `base_snapshot_status` to flip to `ready` and `base_snapshot_id` to populate, then fetch the snapshot at `GET /environments/{env}/snapshots/{id}`. If `base_snapshot_status` flips to `failed`, list snapshots with `GET /environments/{env}/snapshots`. The failed attempt appears there with `status: failed` and a `description` summarizing the failure; read its per-step logs at `GET /environments/{env}/snapshots/{id}/logs` to self-diagnose."
      parameters:
        -
          in: header
          name: Idempotency-Key
          description: ''
          example: optional-unique-request-id
          schema:
            type: string
      responses:
        202:
          description: 'Generation started. Poll the environment for status.'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    environment_id: 019db65d-d286-715f-b169-d2525bcca713
                    snapshot_id: null
                    status: null
                properties:
                  data:
                    type: object
                    properties:
                      environment_id:
                        type: string
                        example: 019db65d-d286-715f-b169-d2525bcca713
                      snapshot_id:
                        type: string
                        example: null
                        nullable: true
                      status:
                        type: string
                        example: null
                        nullable: true
                    required:
                      - environment_id
                      - snapshot_id
                      - status
        401:
          description: ''
          content:
            application/json:
