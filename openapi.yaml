                  data:
                    id: 019e1caf-301b-7253-906a-7460c50e9dda
                    email: jeremy02@example.net
                    role: member
                    account:
                      id: 019e1caf-2f67-73fe-a12e-df24e4a3d4ae
                      name: 'Rice, Emard and Cassin'
                      created_at: '2026-05-12T14:55:03.000000Z'
                      updated_at: '2026-05-12T14:55:03.000000Z'
                    invited_by:
                      name: 'Tristin Conroy'
