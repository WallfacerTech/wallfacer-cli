      summary: 'Attach an existing user to the account'
      operationId: attachAnExistingUserToTheAccount
      description: "Attaches a user who already has a Wallfacer account. The user is identified by email.\nIf no user exists for that email, the request is rejected with `422 user_not_found` -\nuse `POST /v1/accounts/{account}/invitations` to invite them instead.\n\nRequires admin role or higher. Only owners can grant the `owner` role.\n\nIf the target was previously removed from this account, attaching them again restores\ntheir membership under the new role."
      parameters: []
      responses:
        201:
          description: 'User attached to the account.'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 178
                    name: 'Ms. Audra Crooks II'
                    email: gulgowski.asia@example.com
                    avatar_url: 'https://www.gravatar.com/avatar/d6cb3c29392b2d22a8c56ef184a71c72?d=mp&s=200'
                    github_username: null
                    role: null
                    joined_at: null
                    removed_at: null
                properties:
                  data:
                    $ref: '#/components/schemas/AccountUser'
        403:
          description: 'Non-owner attempted to grant owner role.'
          content:
            application/json:
              schema:
                type: object
                example:
                  errors:
                    -
                      message: 'Only owners can grant the owner role.'
                      code: owner_role_restricted
                properties:
                  errors:
                    type: array
                    example:
                      -
                        message: 'Only owners can grant the owner role.'
                        code: owner_role_restricted
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                          example: 'Only owners can grant the owner role.'
                        code:
                          type: string
                          example: owner_role_restricted
        409:
          description: 'User is already an active member.'
          content:
            application/json:
              schema:
                type: object
                example:
                  errors:
                    -
                      message: 'User is already a member of this account.'
                      code: user_already_member
                properties:
                  errors:
                    type: array
                    example:
                      -
                        message: 'User is already a member of this account.'
                        code: user_already_member
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                          example: 'User is already a member of this account.'
                        code:
                          type: string
                          example: user_already_member
        422:
          description: 'Email does not match a registered user.'
          content:
            application/json:
              schema:
                type: object
                example:
                  errors:
                    -
                      message: 'No user exists for that email. Use POST /v1/accounts/{account}/invitations to invite them.'
                      code: user_not_found
                properties:
                  errors:
                    type: array
                    example:
                      -
                        message: 'No user exists for that email. Use POST /v1/accounts/{account}/invitations to invite them.'
                        code: user_not_found
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                          example: 'No user exists for that email. Use POST /v1/accounts/{account}/invitations to invite them.'
                        code:
                          type: string
                          example: user_not_found
      tags:
        - 'Account Users'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'The email address of the user to attach. The email must match a registered Wallfacer user. To invite an email that does not yet belong to a user, use POST /v1/accounts/{account}/invitations. Must be a valid email address. Must not be greater than 255 characters.'
                  example: teammate@example.com
                role:
                  type: string
                  description: 'Role to grant. One of: owner, admin, member. Only owners can grant the owner role.'
                  example: member
                  enum:
                    - owner
                    - admin
                    - member
              required:
                - email
                - role
    parameters:
      -
        in: path
        name: account_id
        description: 'The ID of the account.'
        example: architecto
        required: true
        schema:
          type: string
