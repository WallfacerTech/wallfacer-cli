                    name: server-log.txt
                    media_type: text/plain
                    encoding: utf-8
                    byte_size: 8388608
                    sha256: f16d05ec6b29248d2c61adb1e9263f78e4f7bace1b955014a2d17872cfe4064d
                    status: pending
                    upload_url: null
                    upload_headers: null
                    expires_at: '2026-08-25T19:48:57.000000Z'
                    uploaded_at: null
                    claimed_at: null
                    created_at: '2026-08-25T19:18:57.000000Z'
                properties:
                  data:
                    $ref: '#/components/schemas/Upload'
        503:
          description: 'This deployment has no storage that can accept direct uploads.'
          content:
            application/json:
              schema:
                type: object
                example:
                  errors:
                    -
                      message: 'Direct file uploads are not available on this deployment. Send smaller material inline instead.'
                      code: uploads_unavailable
                properties:
                  errors:
                    type: array
                    example:
                      -
                        message: 'Direct file uploads are not available on this deployment. Send smaller material inline instead.'
                        code: uploads_unavailable
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                          example: 'Direct file uploads are not available on this deployment. Send smaller material inline instead.'
                        code:
                          type: string
                          example: uploads_unavailable
      tags:
        - Uploads
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Name for this file, which is also its filename when the agent reads it. Letters, digits, dot, dash, and underscore; no path separators. Must match the regex /^[A-Za-z0-9][A-Za-z0-9._-]*$/. Must not be greater than 128 characters.'
                  example: server-log.txt
                byte_size:
                  type: integer
                  description: 'Exact size of the file in bytes. The upload URL is signed for this size, so a body of any other length is refused by storage before it lands. At most 33554432 bytes. Must be at least 1. Must not be greater than 33554432.'
                  example: 8388608
                sha256:
                  type: string
                  description: 'SHA-256 of the file contents, in lowercase hex. The upload URL is signed for this digest, and the stored object is checked against it again before the upload can be used. Must match the regex /^[a-f0-9]{64}$/.'
                  example: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
                media_type:
                  type: string
                  description: 'Media type of the content. Any `text/*` type, or one of application/json, application/x-ndjson, application/xml, application/yaml. Defaults to text/plain. Must not be greater than 128 characters.'
                  example: text/plain
                  nullable: true
                encoding:
                  type: string
                  description: 'Character encoding of the content. Only `utf-8` is accepted, which is also the default.'
                  example: utf-8
                  enum:
                    - utf-8
                  nullable: true
              required:
                - name
                - byte_size
                - sha256
