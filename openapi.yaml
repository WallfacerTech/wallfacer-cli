      summary: 'Accept an invitation'
      operationId: acceptAnInvitation
      description: "Transitions the invitation to the `accepted` state and attaches the authenticated user to the\naccount with the invited role. The authenticated user's email must match the invitation email\nexactly. If the user was previously removed from the account, accepting restores their\nmembership under the role from the invitation.\n\nBody: `{\"status\": \"accepted\"}`."
