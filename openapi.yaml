                    -
                      message: Unauthenticated.
                      code: unauthenticated
                properties:
                  errors:
                    type: array
                    example:
                      -
                        message: Unauthenticated.
                        code: unauthenticated
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                          example: Unauthenticated.
                        code:
                          type: string
                          example: unauthenticated
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  errors:
                    -
                      message: 'You do not belong to this account or lack the credentials required to run snapshot generation.'
                      code: forbidden
