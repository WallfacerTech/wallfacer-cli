              schema:
                type: object
                example:
                  data:
                    id: 4
                    session_id: 01a03a5c-8c2a-7098-80c4-6155aa524a02
                    payload:
                      type: user
                      message:
                        role: user
                        content:
                          -
                            text: 'Adipisci quidem nostrum qui commodi incidunt iure.'
                            type: text
                    type: user
                    sequence: 32
                    status: sent
                    display_text: null
                    author: null
                    author_avatar_url: null
                    agent_avatar_url: null
                    channel: app
                    actor:
                      kind: system
                      subsystem: platform
                    created_at: '2026-08-25T19:18:58.865473Z'
                    updated_at: '2026-08-25T19:18:58.865473Z'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 4
                        description: 'Message ID.'
                      session_id:
                        type: string
                        example: 01a03a5c-8c2a-7098-80c4-6155aa524a02
                        description: 'Session the message belongs to.'
                      payload:
                        type: object
                        properties:
                          type:
                            type: string
                            example: user
                          message:
                            type: object
                            properties:
                              role:
                                type: string
                                example: user
                              content:
                                type: array
                                example:
                                  -
                                    text: 'Adipisci quidem nostrum qui commodi incidunt iure.'
                                    type: text
                                items:
                                  type: object
                                  properties:
                                    text:
                                      type: string
                                      example: 'Adipisci quidem nostrum qui commodi incidunt iure.'
                                    type:
                                      type: string
                                      example: text
                        description: 'The raw Claude Code SDK JSONL transcript entry this message wraps. Shape varies by `type`. Treat as opaque except for the fields documented on the `Message` schema for the specific `type` you care about. Pass `view=trimmed` when listing to get the same entry with its image data and large tool inputs and outputs replaced by `{"elided": true, "byte_size": N}` markers; see the `Message` schema for exactly what a trim removes.'
                      type:
                        type: string
                        example: user
                        description: 'Discriminator for the message. Determines the shape of `payload`. Conversation UIs should render `user` and `assistant` turns, and skip or collapse the rest. Full per-variant payload shapes are documented on the `Message` schema in this spec.'
                        enum:
                          - user
                          - assistant
                          - last-prompt
                          - queue-operation
                          - attachment
                          - ai-title
                          - turn-input
                      sequence:
                        type: integer
                        example: 32
                        description: 'Order within the session, assigned when the message is delivered to the agent. Queued messages have `sequence: null`. Render with `ORDER BY sequence ASC` then `created_at ASC` to show the conversation top-to-bottom.'
                        nullable: true
                      status:
                        type: string
                        example: sent
                        description: "Delivery status:\n\n- `queued`: not yet sent to the agent. Will be picked up on the next resume.\n- `sent`: delivered and part of the transcript.\n- `failed`: delivery failed terminally.\n- `cancelled`: the user aborted the session before this message was delivered to the agent. Preserved in the transcript for audit but never replayed."
                        enum:
                          - queued
                          - sent
                          - failed
                          - cancelled
                      display_text:
                        type: string
                        example: null
                        description: 'Clean user-facing text when the underlying `payload` contains server-prepended context (for example, attachment preambles on a user turn). Only set on `type:"user"` messages that needed stripping. Null when the payload is already clean, in which case clients should fall back to `payload.message.content[0].text`.'
                        nullable: true
                      author:
                        type: string
                        example: null
                        description: 'The human who sent a user turn, as `{id, name, avatar_url}`, for rendering the sender next to the message bubble. Resolved from the message''s captured sender, falling back to the session owner for messages that predate per-message sender capture. Set only on `type:"user"` messages; null for assistant turns, non-conversational marker types, and sessions with no resolvable author (for example, automation sessions with no parent task).'
                        nullable: true
                      author_avatar_url:
                        type: string
                        example: null
                        description: 'Deprecated in favor of `author.avatar_url`; retained for older clients. Avatar URL for the human author of a user turn. Set only on `type:"user"` messages; null for assistant turns and non-conversational marker types. May also be null when the session has no resolvable author (for example, automation sessions with no parent task).'
                        nullable: true
                      agent_avatar_url:
                        type: string
                        example: null
                        description: 'Avatar image URL for the assistant that authored this message, for rendering next to the message bubble. Matches the vendor of the model running the session: the Anthropic logo for Claude sessions, the OpenAI logo for Codex sessions. Set on every message emitted by the agent or the platform (all non-`user` types); null on `type:"user"` turns, which carry the human sender in `author` instead. Treat the URL as opaque; the specific image may change.'
                        nullable: true
                      channel:
                        type: string
                        example: app
                        description: "Where this message arrived from or was delivered to:\n\n- `app`: the conversation composer in our own clients.\n- `slack`: a connected Slack workspace.\n- `email`: the address the agent receives mail at."
                        enum:
                          - app
                          - slack
                          - email
                      actor:
                        type: object
                        properties:
                          kind:
                            type: string
                            example: system
                          subsystem:
                            type: string
                            example: platform
                        description: "Who produced this message. Always present, and captured when the message was written, so it keeps rendering correctly after the person is renamed, joins the account, or leaves it. Render the sender from this rather than by looking a user id up: most senders on a channel have no account with us, and a `user_id` of `null` is normal rather than an error.\n\nThe `kind` field says which shape to expect:\n\n- `user`: a person on your account. Carries `user_id`, `display_name`, `email_at_time`.\n- `ai`: one of your agents. Carries `ai_user_id`, `display_name`, `harness`, `model_identifier`.\n- `external`: somebody with no account here. Carries `provider`, `external_id`, `display_name`, `email_at_time`, and `user_id` when their address matched one of your members.\n- `system`: produced by the platform rather than by a person or an agent. Covers non-conversational marker messages and older messages whose author can no longer be resolved; render it as an unattributed platform message."
                      created_at:
                        type: string
                        example: '2026-08-25T19:18:58.865473Z'
                        description: 'ISO 8601 timestamp of when this message was created (that is, when it entered the queue or was delivered, depending on `status`).'
                      updated_at:
                        type: string
                        example: '2026-08-25T19:18:58.865473Z'
                        description: 'ISO 8601 timestamp of the most recent change to the message record (for example, when it flipped from `queued` to `sent`).'
                    required:
                      - id
                      - session_id
                      - payload
                      - type
                      - sequence
                      - status
                      - display_text
                      - author
                      - author_avatar_url
                      - agent_avatar_url
                      - channel
                      - actor
                      - created_at
                      - updated_at
