  '/v1/accounts/{account_id}/environments/{environment_id}/snapshots':
    post:
      summary: "Regenerate an environment's snapshot"
      operationId: regenerateAnEnvironmentsSnapshot
      description: "Triggers a fresh snapshot-generation cycle. A VM boots from the environment's manifest, runs setup to completion, captures the result, and the new snapshot is promoted to the environment's `base_snapshot_id`. Returns 202 immediately; the `snapshot_id` is null while generation is bootstrapping. Poll `GET /environments/{env}` and wait for `base_snapshot_status` to flip to `ready` and `base_snapshot_id` to populate, then fetch the snapshot at `GET /environments/{env}/snapshots/{id}`. If `base_snapshot_status` flips to `failed`, read `GET /environments/{env}/logs`: the Wallfacer-authored `provisioning` source there is the authoritative account of what failed, at which stage, and whether to retry or fix your manifest, and it covers infra-stage failures (a pre-boot rejection that leaves no snapshot row at all, or a capture timeout) that produce no per-step logs. A failed setup step additionally appears in `GET /environments/{env}/snapshots` with `status: failed` and a `description`, and its stdout/stderr is at `GET /environments/{env}/snapshots/{id}/logs`."
      parameters:
        -
          in: header
          name: Idempotency-Key
          description: ''
          example: optional-unique-request-id
          schema:
            type: string
      responses:
        202:
          description: 'Generation started. Poll the environment for status.'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    environment_id: 01a03a5c-8672-7007-9d2a-e1a65495d402
                    snapshot_id: null
                    status: null
                properties:
                  data:
                    type: object
                    properties:
                      environment_id:
                        type: string
                        example: 01a03a5c-8672-7007-9d2a-e1a65495d402
                      snapshot_id:
                        type: string
                        example: null
                        nullable: true
                      status:
                        type: string
                        example: null
                        nullable: true
                    required:
                      - environment_id
                      - snapshot_id
                      - status
