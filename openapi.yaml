  '/v1/accounts/{account_id}/agents/{agent_user_id}/identities/{provider}/tokens':
    post:
      summary: 'Mint an access token'
      operationId: mintAnAccessToken
      description: "Mints a fresh access token for the agent's own account on the named system, and returns it. Only supported for `google`.\n\nThe agent is handed one of these in its environment when its computer starts, so nothing has to call this to get going. It exists because a Google access token lasts about an hour and a long piece of work can outlive it: a call that starts failing with 401 needs a new token, not a permissions change, and this is where the new one comes from.\n\nAn agent mints tokens for itself and for nothing else. This is the only Google endpoint we serve: Drive, Docs, Sheets, Slides, Gmail and Calendar are Google's own APIs, called with the token this returns.\n\nEvery call mints a new token, so an `Idempotency-Key` is ignored here. Replaying an earlier response would hand back the expired token the caller rang up to replace."
      parameters: []
      responses:
        201:
          description: 'A fresh token, valid for about an hour.'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    access_token: ya29.a0AfB_by...
                    expires_at: '2026-07-29T15:02:11.000000Z'
                    scopes:
                      - 'https://www.googleapis.com/auth/drive'
                      - 'https://www.googleapis.com/auth/documents'
                      - 'https://www.googleapis.com/auth/spreadsheets'
                      - 'https://www.googleapis.com/auth/presentations'
                      - 'https://www.googleapis.com/auth/gmail.readonly'
                      - 'https://www.googleapis.com/auth/calendar'
                properties:
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                        example: ya29.a0AfB_by...
                      expires_at:
                        type: string
                        example: '2026-07-29T15:02:11.000000Z'
                      scopes:
                        type: array
                        example:
                          - 'https://www.googleapis.com/auth/drive'
                          - 'https://www.googleapis.com/auth/documents'
                          - 'https://www.googleapis.com/auth/spreadsheets'
                          - 'https://www.googleapis.com/auth/presentations'
                          - 'https://www.googleapis.com/auth/gmail.readonly'
                          - 'https://www.googleapis.com/auth/calendar'
                        items:
                          type: string
                    required:
                      - access_token
                      - expires_at
