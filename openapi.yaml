                          example: not_found
      tags:
        - Snapshots
    get:
      summary: 'List snapshots for an environment'
      operationId: listSnapshotsForAnEnvironment
      description: 'Returns every generation attempt belonging to this environment, most recent first. Paginated. Includes both successful snapshots (`status: ready`) and failed attempts (`status: failed`). Failed attempts carry no captured disk but expose per-step logs at `GET /environments/{env}/snapshots/{id}/logs`, making them the primary path for self-diagnosing a failed generation.'
