            application/json:
              schema:
                type: object
                example:
                  data:
                    kind: event
                    explanation: 'Fires when an issue is labeled bug.'
                    grounded_on_event_id: ...
                    triggers:
                      -
                        source: github
                        type: issue.labeled
                        match: "${event.data.label.name} == 'bug'"
                        sampled_recent: 20
                        matched_recent: 3
                        matched_event_ids:
                          - ...
                    dedupe:
                      enabled: true
                      key: '${event.data.issue.number}'
                      matched_events: 5
                      would_open_tasks: 3
                properties:
                  data:
                    type: object
                    properties:
                      kind:
                        type: string
                        example: event
                      explanation:
                        type: string
                        example: 'Fires when an issue is labeled bug.'
                      grounded_on_event_id:
                        type: string
                        example: ...
                      triggers:
                        type: array
                        example:
                          -
                            source: github
                            type: issue.labeled
                            match: "${event.data.label.name} == 'bug'"
                            sampled_recent: 20
                            matched_recent: 3
                            matched_event_ids:
                              - ...
                        items:
                          type: object
                          properties:
                            source:
                              type: string
                              example: github
                            type:
                              type: string
                              example: issue.labeled
                            match:
                              type: string
                              example: "${event.data.label.name} == 'bug'"
                            sampled_recent:
                              type: integer
                              example: 20
                            matched_recent:
                              type: integer
                              example: 3
                            matched_event_ids:
                              type: array
                              example:
                                - ...
                              items:
                                type: string
                      dedupe:
