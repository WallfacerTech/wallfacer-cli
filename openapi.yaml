            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'What to call the credential, in your own words: "Mixpanel (read-only)". The name an agent uses is derived from this one, so keep it short and recognisable. Maximum 120 characters, and it must contain at least one letter or digit. It may not end in "username": that shape is reserved for the username half of a `login`. Must not be greater than 120 characters.'
                  example: 'Mixpanel (read-only)'
                kind:
                  type: string
                  description: "What shape the value is. `api_key` for a provider key, `login` for a username and password pair, `token` for anything else a service issues and expects back verbatim, `totp` for the seed behind an authenticator app. Prefer a scoped `api_key` wherever the service offers one: it is revocable on its own, needs no browser, and skips `totp` entirely.\n\nStoring a `totp` seed beside a password means this platform holds **both factors**, so the account's two-factor protection is reduced to one for anything the agent can reach. That is the same trade a password manager that stores your codes makes. Every code minted from the seed is recorded with the agent and session that asked for it; the other kinds are recorded once per session they are delivered into."
                  example: api_key
                  enum:
                    - api_key
                    - login
                    - token
                    - totp
                username:
                  type: string
                  description: 'The username half of a `login`. Required for that kind and rejected as meaningless for the others. Held in the clear, because it is not the secret and an agent has to be able to see which login it is signing in as. This field is required when <code>kind</code> is <code>login</code>. Must not be greater than 255 characters.'
                  example: null
                  nullable: true
                value:
                  type: string
                  description: "The value to seal: the key, the password, the token, or, for `totp`, the seed. Maximum 8 KiB. Write-only from this moment on. No endpoint ever returns it, and replacing it is the only way to change it.\n\nA `totp` seed is accepted either as the bare base32 secret the service printed (spaces and all) or as the `otpauth://totp/...` URI behind its QR code, which is the one that carries a non-default digit count, period or algorithm. A seed that could never generate a valid code is refused here, with the reason, rather than inside a login flow later."
                  example: No-example
              required:
                - name
                - kind
                - value
