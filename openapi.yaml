    patch:
      summary: 'Update a page'
      operationId: updateAPage
      description: "Updates a page's title, body, parent, or position. Moving a page (changing `parent_page_id` and `position`) reorganizes the handbook tree; moving a page under itself or one of its own sub-pages is rejected. Passing `deleted: false` restores a deleted page (its content and history come back intact; if its parent was deleted in the meantime it restores to the top level)."
      parameters: []
      responses: {  }
      tags:
        - Pages
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: 'New page title. Must not be greater than 255 characters.'
                  example: 'What makes a great pull request'
                body:
                  type: string
                  description: 'New markdown body. Pass null to clear. Must not be greater than 100000 characters.'
                  example: null
                  nullable: true
                parent_page_id:
                  type: string
                  description: 'Move the page under another page. Pass null to move it to the top level. Moving a page under itself or one of its own sub-pages is rejected. Must be a valid UUID.'
                  example: null
                  nullable: true
                position:
                  type: integer
                  description: 'New sort position among siblings. Must be at least 0.'
                  example: 0
                deleted:
                  type: boolean
                  description: 'Pass false to restore a deleted page. Its content and revision history come back intact; if its parent was deleted in the meantime it restores to the top level. Deleting goes through DELETE.'
                  example: null
    delete:
      summary: 'Delete a page'
      operationId: deleteAPage
      description: "Deletes the page. Anything filed under it (sub-pages and playbooks) is not deleted: children move up to the deleted page's parent, or to the top level when the deleted page was top-level. The page's revision history is retained."
