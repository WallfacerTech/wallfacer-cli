  '/v1/accounts/{account_id}/users':
    get:
      summary: 'List account users'
      operationId: listAccountUsers
      description: 'Returns active members of the account with their roles. Supports filtering by GitHub username, which is useful for looking up whether a specific GitHub user is a member of the account (for example, when mapping a PR author back to a Wallfacer user). Filters return an empty `data` array when no member matches; the endpoint does not 404 on a zero-result filter. Requires member role or higher.'
      parameters:
        -
          in: query
          name: per_page
          description: 'Results per page (max 100).'
          example: 25
          required: false
          schema:
            type: integer
            description: 'Results per page (max 100).'
            example: 25
        -
          in: query
          name: github_username
          description: "Exact match on the user's connected GitHub username (case-insensitive). Returns an empty array if no member of this account has that GitHub username connected, which also covers the case of a user who exists but hasn't connected GitHub yet."
          example: kressaty
          required: false
          schema:
            type: string
            description: "Exact match on the user's connected GitHub username (case-insensitive). Returns an empty array if no member of this account has that GitHub username connected, which also covers the case of a user who exists but hasn't connected GitHub yet."
            example: kressaty
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
