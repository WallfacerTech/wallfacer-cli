        -
          in: query
          name: q
          description: 'The search query. Required and cannot be blank.'
          example: login
          required: true
          schema:
            type: string
            description: 'The search query. Required and cannot be blank.'
            example: login
        -
          in: query
          name: types
          description: 'Comma-separated list limiting which record types to search. Any of `environments`, `tasks`, `sessions`, `pages`, `pipelines`. Defaults to all of them.'
          example: 'tasks,pages'
          required: false
          schema:
            type: string
            description: 'Comma-separated list limiting which record types to search. Any of `environments`, `tasks`, `sessions`, `pages`, `pipelines`. Defaults to all of them.'
            example: 'tasks,pages'
        -
          in: query
          name: per_type
          description: 'Maximum results per type, from 1 to 25. Defaults to 10.'
          example: 10
          required: false
          schema:
            type: integer
            description: 'Maximum results per type, from 1 to 25. Defaults to 10.'
            example: 10
        -
          in: query
          name: cursor
          description: "Per-type pagination cursors, keyed by type. For example `cursor[tasks]` continues the tasks results from a previous response's `meta.next_cursor.tasks`."
          example: []
          required: false
          schema:
            type: object
