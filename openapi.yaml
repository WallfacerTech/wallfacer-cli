    get:
      summary: 'Get a command run'
      operationId: getACommandRun
      description: "The run's current status plus the output it has produced since a byte cursor. This is the follow endpoint: pass the previous read's `output.next_offset` as `since` and each read returns only what is new.\n\n`wait_seconds` holds the request open until the run finishes, so following a run costs one request per `wait_seconds` rather than one per poll interval. The response arrives as soon as the run ends, whether or not the wait is used up.\n\nThe record is authoritative even when the output is not: `output` is null when the VM could not be reached or the run finished long enough ago for its output to have been dropped, and the status, exit code, and timings are still correct."
      parameters:
        -
          in: query
          name: since
          description: "Byte offset to read output from. Use the previous read's `output.next_offset`. Defaults to 0, the start of the run."
          example: 4096
          required: false
          schema:
            type: integer
            description: "Byte offset to read output from. Use the previous read's `output.next_offset`. Defaults to 0, the start of the run."
            example: 4096
        -
          in: query
          name: max_bytes
          description: 'Cap on the bytes of output this read returns. Omit for the platform default.'
          example: 65536
          required: false
          schema:
            type: integer
            description: 'Cap on the bytes of output this read returns. Omit for the platform default.'
            example: 65536
